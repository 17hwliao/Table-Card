<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17231f">
  <title>牌桌 · Card Table</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #101714; color: #f5f1df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 20%, #294337, #101714 65%); }
    main { width: min(980px, 92vw); margin: 0 auto; padding: 9vh 0 48px; }
    header { margin-bottom: 36px; }
    .eyebrow { color: #c8a45e; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 600 clamp(38px, 7vw, 66px)/1.05 Georgia, "Microsoft YaHei", serif; letter-spacing: .04em; }
    header p { color: #bac7bb; max-width: 600px; line-height: 1.7; }
    .panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 24px; background: #18221edc; border: 1px solid #82947c44; border-radius: 18px; box-shadow: 0 24px 80px #0005; }
    label { display: grid; gap: 8px; color: #c7d0c5; font-size: 14px; }
    .checkLabel { display: flex; align-items: center; gap: 10px; }
    .checkLabel input { width: auto; accent-color: #d1b16e; }
    select, input { width: 100%; padding: 13px 14px; border: 1px solid #5c7064; border-radius: 9px; color: #f5f1df; background: #101814; font: inherit; }
    button { align-self: end; min-height: 46px; border: 0; border-radius: 9px; padding: 12px 18px; color: #1a2018; background: #d1b16e; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #e5c989; }
    #result { grid-column: 1 / -1; min-height: 24px; margin: 0; color: #d4ddce; overflow-wrap: anywhere; }
    .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .tag { padding: 7px 10px; border: 1px solid #607365; border-radius: 999px; color: #c7d0c5; font-size: 12px; }
    #liveRoom { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; margin-top: 18px; }
    .livePanel { min-width: 0; padding: 18px; background: #18221edc; border: 1px solid #82947c44; border-radius: 14px; }
    .livePanel h2 { margin: 0 0 12px; font-size: 16px; color: #d1b16e; }
    #gameState { max-height: 350px; overflow: auto; color: #d4ddce; font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    #liarBoard { grid-column: 1 / -1; padding: 20px; border: 1px solid #82947c44; border-radius: 18px; background: linear-gradient(145deg, #1b2b23, #101914); }
    .barHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .barHeader h2 { margin: 0; color: #f3e9d1; font: 600 22px Georgia, "Microsoft YaHei", serif; }
    .targetBadge { padding: 10px 16px; border: 1px solid #c8a45e88; border-radius: 12px; color: #f6d78f; background: #27382d; font-weight: 700; }
    .barTable { display: grid; grid-template-areas: "top top top" "left center right" "bottom bottom bottom"; grid-template-columns: 1fr minmax(180px, 1.4fr) 1fr; gap: 12px; align-items: center; min-height: 300px; padding: 14px; border: 1px solid #67856b; border-radius: 48% / 32%; background: radial-gradient(ellipse at center, #315942, #1b3b2b 70%, #142d20); box-shadow: inset 0 0 50px #06150c99, 0 18px 40px #0005; }
    .barSeat { min-width: 0; padding: 10px; border: 1px solid #9aac8d55; border-radius: 12px; background: #10271ec9; text-align: center; }
    .barSeat.top { grid-area: top; justify-self: center; min-width: 42%; }
    .barSeat.left { grid-area: left; }
    .barSeat.right { grid-area: right; }
    .barSeat.bottom { grid-area: bottom; justify-self: center; min-width: 42%; border-color: #d1b16e; }
    .barSeat.active { box-shadow: 0 0 0 2px #f6d78f, 0 0 24px #d1b16e55; }
    .barSeat.dead { opacity: .48; filter: grayscale(1); }
    .seatName { color: #f3e9d1; font-weight: 700; }
    .seatMeta { margin-top: 5px; color: #bdcbbd; font-size: 12px; }
    .backCards { display: flex; justify-content: center; gap: 3px; margin-top: 7px; }
    .backCard { width: 16px; height: 22px; border: 1px solid #d7c48c; border-radius: 3px; background: repeating-linear-gradient(45deg,#304e3c,#304e3c 3px,#c5a968 3px,#c5a968 4px); }
    .barCenter { grid-area: center; padding: 14px; border-radius: 14px; text-align: center; color: #e7e2cf; background: #0c2118aa; }
    .barCenter strong { display: block; margin-bottom: 8px; color: #f6d78f; font-size: 20px; }
    #barResult { min-height: 38px; margin-top: 12px; color: #f4dfac; font-size: 13px; line-height: 1.5; }
    .handTitle { margin: 18px 0 10px; color: #cbd6c6; font-size: 13px; }
    #barHand { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; min-height: 100px; }
    .barCard { width: 62px; height: 88px; border: 1px solid #d7d0bd; border-radius: 8px; color: #243329; background: linear-gradient(135deg,#fffef5,#d9dfd3); box-shadow: 0 5px 10px #0004; font: 700 24px Georgia,serif; cursor: pointer; transition: transform .12s,border-color .12s; }
    .barCard.joker { color: #7651a5; }
    .barCard.selected { transform: translateY(-9px); border: 2px solid #e5be65; box-shadow: 0 8px 18px #0006; }
    .barCard:disabled { cursor: default; opacity: .8; }
    .barActions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 12px; }
    .barActions button.secondary { color: #d4ddce; border: 1px solid #78907c; background: #25392d; }
    #landlordBoard { grid-column: 1 / -1; padding: 20px; border: 1px solid #82947c44; border-radius: 18px; background: linear-gradient(145deg, #1b2b23, #101914); }
    .landlordHeader { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .landlordHeader h2 { margin:0; font:600 22px Georgia,"Microsoft YaHei",serif; }
    .landlordTable { display:grid; grid-template-areas:"left center right" "bottom bottom bottom"; grid-template-columns:1fr 1.2fr 1fr; gap:14px; align-items:center; min-height:260px; padding:18px; border:1px solid #67856b; border-radius:28px; background:radial-gradient(ellipse,#315942,#1b3b2b 72%,#142d20); }
    .landlordSeat { min-width:0; padding:10px; border:1px solid #9aac8d55; border-radius:12px; text-align:center; background:#10271ec9; }
    .landlordSeat.left { grid-area:left; } .landlordSeat.right { grid-area:right; } .landlordSeat.bottom { grid-area:bottom; justify-self:center; min-width:44%; border-color:#d1b16e; }
    .landlordSeat.active { box-shadow:0 0 0 2px #f6d78f,0 0 24px #d1b16e55; }
    .landlordSeat strong { display:block; color:#f3e9d1; }
    .landlordSeat small { color:#bdcbbd; }
    .landlordCenter { grid-area:center; padding:14px; border-radius:14px; text-align:center; background:#0c2118aa; color:#e7e2cf; }
    .landlordCenter h3 { margin:0 0 8px; color:#f6d78f; }
    #landlordTrick { min-height:32px; color:#fff4da; }
    #landlordBottom { margin-top:8px; color:#d7c48c; font-size:13px; }
    #landlordHand { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; min-height:100px; margin-top:16px; }
    .playingCard { width:54px; height:80px; border:1px solid #d7d0bd; border-radius:7px; color:#243329; background:linear-gradient(135deg,#fffef5,#d9dfd3); box-shadow:0 5px 10px #0004; font:700 16px Georgia,serif; cursor:pointer; transition:transform .12s; }
    .playingCard.selected { transform:translateY(-9px); outline:2px solid #e5be65; }
    .playingCard.red { color:#ab3333; } .playingCard:disabled { cursor:default; }
    .landlordActions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .landlordActions .secondary { color:#d4ddce; border:1px solid #78907c; background:#25392d; }
    #gomokuBoard { grid-column:1/-1; padding:20px; border:1px solid #82947c44; border-radius:18px; background:linear-gradient(145deg,#1b2b23,#101914); }
    .gomokuHeader { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .gomokuHeader h2 { margin:0; font:600 22px Georgia,"Microsoft YaHei",serif; }
    #gomokuGrid { display:grid; grid-template-columns:repeat(15,1fr); width:min(92vw,600px); aspect-ratio:1; margin:auto; padding:9px; border-radius:10px; background:linear-gradient(135deg,#dfbb7c,#b88548); box-shadow:inset 0 0 22px #6d4626aa,0 16px 38px #0005; }
    .gomokuCell { position:relative; min-width:0; padding:0; border:0; border-radius:0; background:transparent; }
    .gomokuCell::before,.gomokuCell::after { content:""; position:absolute; z-index:0; background:#54391f; }
    .gomokuCell::before { left:0; right:0; top:50%; height:1px; }
    .gomokuCell::after { top:0; bottom:0; left:50%; width:1px; }
    .gomokuCell:hover { background:#ffffff18; }
    .stone { position:absolute; z-index:1; left:50%; top:50%; width:76%; height:76%; transform:translate(-50%,-50%); border-radius:50%; box-shadow:2px 3px 5px #0007; }
    .stone.black { background:radial-gradient(circle at 35% 30%,#777,#171717 60%,#000); }
    .stone.white { background:radial-gradient(circle at 35% 30%,#fff,#e8e4d9 65%,#a9a397); }
    .lastMove { outline:2px solid #c84031; outline-offset:-5px; border-radius:50%; }
    .hoshiDot { position:absolute; z-index:1; left:50%; top:50%; width:5px; height:5px; transform:translate(-50%,-50%); border-radius:50%; background:#54391f; }
    .gomokuStatus { color:#d7c48c; }
    #chatLog { display: flex; flex-direction: column; gap: 8px; min-height: 180px; max-height: 270px; overflow: auto; padding: 0; list-style: none; }
    #chatLog li { color: #d4ddce; overflow-wrap: anywhere; }
    #chatLog strong { color: #d1b16e; }
    .chatInput { display: flex; gap: 8px; }
    .chatInput input { min-width: 0; }
    .chatInput button { white-space: nowrap; }
    footer { margin-top: 26px; color: #8d9c90; font-size: 12px; }
    @media(max-width: 600px) { .panel { grid-template-columns: 1fr; padding: 18px; } #result { grid-column: auto; } #liveRoom { grid-template-columns: 1fr; } .barTable { grid-template-columns: .8fr 1.3fr .8fr; min-height: 260px; padding: 8px; gap: 6px; border-radius: 24px; } .barSeat { padding: 7px 4px; } .barCenter { padding: 8px 4px; } .barHeader h2 { font-size: 18px; } .barCard { width: 50px; height: 72px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Independent tabletop games</div>
      <h1>牌桌</h1>
      <p>选择一种游戏并创建房间。已接入规则引擎的模式可以创建对局状态，牌桌交互界面正在逐项实现。</p>
      <div id="modes" class="modes" aria-label="游戏模式"></div>
    </header>
    <section class="panel" aria-label="创建游戏房间">
      <label>游戏模式<select id="mode"></select></label>
      <label>座位数<select id="seats"></select></label>
      <label>玩家名称<input id="name" maxlength="24" value="玩家 1" autocomplete="nickname"></label>
      <label>玩家编号<input id="playerId" maxlength="40" autocomplete="off" placeholder="自动生成"></label>
      <label>房间号<input id="roomCode" maxlength="6" autocomplete="off" placeholder="创建后自动填入，也可输入好友房间号"></label>
      <label id="trainingOption" class="checkLabel"><input id="trainingBots" type="checkbox">斗地主人机训练（2 个 Sunjiajia）</label>
      <button id="create">创建房间</button>
      <button id="join">加入房间</button>
      <button id="ready">准备</button>
      <button id="start">开始对局</button>
      <p id="result" role="status">准备就绪</p>
    </section>
    <section id="liveRoom" hidden aria-label="实时房间">
      <div id="landlordBoard" hidden>
        <div class="landlordHeader"><h2>斗地主 · Sunjiajia</h2><div id="landlordInfo" class="targetBadge"></div></div>
        <div class="landlordTable" id="landlordTable">
          <div class="landlordSeat left" data-seat="left"></div>
          <div class="landlordSeat right" data-seat="right"></div>
          <div class="landlordSeat bottom" data-seat="bottom"></div>
          <div class="landlordCenter"><h3 id="landlordTurn">等待玩家</h3><div id="landlordTrick"></div><div id="landlordBottom"></div></div>
        </div>
        <div id="landlordHand"></div>
        <div class="landlordActions" id="bidActions">
          <button data-bid="0">不叫</button><button data-bid="1">叫 1 分</button><button data-bid="2">叫 2 分</button><button data-bid="3">叫 3 分</button>
        </div>
        <div class="landlordActions" id="playActions"><button id="landlordPlay">出牌</button><button id="landlordPass" class="secondary">不出</button></div>
      </div>
      <div id="gomokuBoard" hidden>
        <div class="gomokuHeader"><h2>五子棋</h2><div class="gomokuStatus" id="gomokuStatus">等待玩家</div></div>
        <div id="gomokuGrid" aria-label="五子棋棋盘"></div>
      </div>
      <div id="liarBoard" hidden>
        <div class="barHeader"><h2>骗子酒馆</h2><div id="barTarget" class="targetBadge">本局牌 —</div></div>
        <div class="barTable" id="barTable">
          <div class="barSeat top" data-seat="top"></div>
          <div class="barSeat left" data-seat="left"></div>
          <div class="barSeat right" data-seat="right"></div>
          <div class="barSeat bottom" data-seat="bottom"></div>
          <div class="barCenter"><strong id="barCenterTitle">等待玩家</strong><span id="barCenterText"></span><div id="barResult"></div></div>
        </div>
        <div class="handTitle">你的手牌（选择 1–3 张扣下）</div>
        <div id="barHand"></div>
        <div class="barActions"><button id="barPlay" disabled>扣牌并声明</button><button id="barChallenge" class="secondary" disabled>质疑上一手</button></div>
      </div>
      <div id="gameDebugPanel" class="livePanel"><h2>当前对局状态</h2><pre id="gameState">等待服务器状态…</pre></div>
      <div class="livePanel">
        <h2>房间聊天</h2>
        <ul id="chatLog" aria-live="polite"></ul>
        <form id="chatForm" class="chatInput"><input id="chatText" maxlength="300" placeholder="输入消息" autocomplete="off"><button>发送</button></form>
      </div>
    </section>
    <footer>本地运行 · 游戏规则与 UI 正在独立实现</footer>
  </main>
  <script>
    const modeSelect = document.querySelector('#mode');
    const seatsSelect = document.querySelector('#seats');
    const status = document.querySelector('#result');
    let modes = [];
    let roomSocket = null;
    let roomView = null;
    let gameView = null;
    let selectedCards = new Set();
    function refreshSeats() {
      const mode = modes.find(item => item.id === modeSelect.value);
      document.querySelector('#trainingOption').hidden = mode?.id !== 'landlord';
      if (mode?.id !== 'landlord') document.querySelector('#trainingBots').checked = false;
      seatsSelect.replaceChildren();
      if (!mode) return;
      for (let n = mode.minSeats; n <= mode.maxSeats; n++) {
        const option = new Option(`${n} 人`, String(n));
        seatsSelect.add(option);
      }
    }
    async function loadModes() {
      const response = await fetch('/api/modes');
      if (!response.ok) throw new Error('无法读取游戏模式');
      modes = await response.json();
      for (const mode of modes) {
        modeSelect.add(new Option(`${mode.name} · ${mode.progress}`, mode.id));
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = `${mode.name} · ${mode.progress}`;
        document.querySelector('#modes').append(tag);
      }
      refreshSeats();
    }
    modeSelect.addEventListener('change', refreshSeats);
    function identity() {
      const name = document.querySelector('#name').value.trim();
      const idInput = document.querySelector('#playerId');
      const playerId = idInput.value.trim() || crypto.randomUUID();
      idInput.value = playerId;
      return { playerId, name };
    }
    async function roomAction(action, body = {}) {
      const code = document.querySelector('#roomCode').value.trim().toUpperCase();
      if (!code) throw new Error('请先输入房间号');
      const response = await fetch(`/api/rooms/${encodeURIComponent(code)}/${action}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '操作失败');
      status.textContent = `${data.code} · ${data.players.map(player => `${player.name}${player.ready ? ' ✓' : ''}`).join(' / ')} · ${data.phase === 1 ? '对局已开始（交互界面接入中）' : '等待玩家'}`;
      return data;
    }
    function connectRoom(code, playerId) {
      if (roomSocket) roomSocket.close();
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      roomSocket = new WebSocket(`${scheme}://${location.host}/api/rooms/${encodeURIComponent(code)}/ws?playerId=${encodeURIComponent(playerId)}`);
      document.querySelector('#liveRoom').hidden = false;
      roomSocket.addEventListener('message', event => {
        const message = JSON.parse(event.data);
        if (message.type === 'room') {
          roomView = message.data;
          gameView = null;
          renderRoomState();
        }
        if (message.type === 'state') {
          roomView = message.room;
          gameView = message.game;
          renderRoomState();
        }
        if (message.type === 'chat') {
          const item = document.createElement('li');
          const name = document.createElement('strong');
          name.textContent = `${message.name}: `;
          item.append(name, document.createTextNode(message.text));
          const log = document.querySelector('#chatLog');
          log.append(item);
          log.scrollTop = log.scrollHeight;
        }
        if (message.type === 'error') status.textContent = message.error;
      });
      roomSocket.addEventListener('open', () => { status.textContent = `已连接房间 ${code}`; });
      roomSocket.addEventListener('close', () => { status.textContent = '实时连接已断开'; });
    }
    function rankName(rank) { return ({ 1: 'Q', 2: 'K', 3: 'A', 4: 'Joker' })[rank] || '?'; }
    function sendGameAction(action) {
      if (!roomSocket || roomSocket.readyState !== WebSocket.OPEN) {
        status.textContent = '实时连接尚未就绪';
        return;
      }
      roomSocket.send(JSON.stringify({ type: 'action', action }));
    }
    function renderRoomState() {
      document.querySelector('#liveRoom').hidden = false;
      document.querySelector('#gameState').textContent = JSON.stringify({ room: roomView, game: gameView }, null, 2);
      const isLiarBar = roomView?.mode === 'liar_bar' && gameView?.players;
      const isLandlord = roomView?.mode === 'landlord' && gameView?.phase !== undefined;
      const isGomoku = roomView?.mode === 'gomoku' && gameView?.board;
      document.querySelector('#liarBoard').hidden = !isLiarBar;
      document.querySelector('#landlordBoard').hidden = !isLandlord;
      document.querySelector('#gomokuBoard').hidden = !isGomoku;
      document.querySelector('#gameDebugPanel').hidden = isLiarBar || isLandlord || isGomoku;
      if (isLiarBar) renderLiarBar();
      if (isLandlord) renderLandlord();
      if (isGomoku) renderGomoku();
    }
    function renderLiarBar() {
      const playerId = document.querySelector('#playerId').value;
      const ownSeat = roomView.players.findIndex(player => player.id === playerId);
      const ownPlayer = gameView.players.find(player => player.id === playerId);
      const isTurn = ownSeat >= 0 && roomView.players[gameView.turn]?.id === playerId;
      const hand = gameView.hand || [];
      const validIds = new Set(hand.map(card => card.id));
      selectedCards = new Set([...selectedCards].filter(id => validIds.has(id)));
      document.querySelector('#barTarget').textContent = `本局牌 ${rankName(gameView.target)}`;
      document.querySelector('#barCenterTitle').textContent = gameView.phase === 1 ? '游戏结束' : isTurn ? '轮到你了' : `${roomView.players[gameView.turn]?.name || '玩家'}行动中`;
      const pending = gameView.pending;
      document.querySelector('#barCenterText').textContent = pending ? `${gameView.players[pending.seat]?.name || '玩家'}扣下了 ${pending.count} 张牌` : '选择 1–3 张牌扣下；下一位可以跟牌或质疑';
      const challengeResult = gameView.lastChallenge;
      const shotText = challengeResult?.volley?.map(shot => `${gameView.players[shot.seat].name} 开枪 ${shot.shotNumber}/6${shot.eliminated ? '，淘汰' : ''}`).join('；') || '';
      const resultText = challengeResult ? `${challengeResult.bluff ? '质疑成功，发现谎言' : '质疑失败，牌面属实'} · 翻出 ${challengeResult.revealed.map(card => rankName(card.rank)).join('、')} · ${shotText}` : '';
      document.querySelector('#barResult').textContent = gameView.winner ? `${resultText} · ${roomView.players.find(player => player.id === gameView.winner)?.name || '玩家'} 获胜` : resultText;
      const positions = ['bottom', 'left', 'top', 'right'];
      for (let seat = 0; seat < 4; seat++) {
        const relative = (seat - ownSeat + 4) % 4;
        const box = document.querySelector(`#barTable [data-seat="${positions[relative]}"]`);
        const player = gameView.players[seat];
        box.classList.toggle('active', gameView.turn === seat && gameView.phase !== 1);
        box.classList.toggle('dead', !player.alive);
        box.replaceChildren();
        const name = document.createElement('div');
        name.className = 'seatName';
        name.textContent = `${player.name}${seat === ownSeat ? '（你）' : ''}${player.alive ? '' : ' · 已淘汰'}`;
        const meta = document.createElement('div');
        meta.className = 'seatMeta';
        meta.textContent = `开枪 ${player.shots}/6 · 手牌 ${player.handCount} 张`;
        box.append(name, meta);
        if (seat !== ownSeat && player.alive) {
          const backs = document.createElement('div');
          backs.className = 'backCards';
          for (let i = 0; i < Math.min(player.handCount, 5); i++) {
            const back = document.createElement('span');
            back.className = 'backCard';
            backs.append(back);
          }
          box.append(backs);
        }
      }
      const handBox = document.querySelector('#barHand');
      handBox.replaceChildren();
      hand.forEach(card => {
        const button = document.createElement('button');
        button.className = `barCard${card.rank === 4 ? ' joker' : ''}${selectedCards.has(card.id) ? ' selected' : ''}`;
        button.textContent = rankName(card.rank);
        button.setAttribute('aria-pressed', selectedCards.has(card.id));
        button.disabled = !isTurn || gameView.phase === 1;
        button.addEventListener('click', () => {
          if (selectedCards.has(card.id)) selectedCards.delete(card.id);
          else if (selectedCards.size < 3) selectedCards.add(card.id);
          renderLiarBar();
        });
        handBox.append(button);
      });
      const play = document.querySelector('#barPlay');
      play.disabled = !isTurn || selectedCards.size < 1 || gameView.phase === 1;
      play.textContent = `扣下 ${selectedCards.size || ''} 张并声明 ${rankName(gameView.target)}`;
      const challenge = document.querySelector('#barChallenge');
      challenge.disabled = !isTurn || !pending?.canCall || gameView.phase === 1;
      play.onclick = () => sendGameAction({ type: 'play', cardIds: [...selectedCards] });
      challenge.onclick = () => sendGameAction({ type: 'challenge' });
      if (!ownPlayer) status.textContent = '房间视图不可用，请确认玩家编号。';
    }
    function landlordRank(rank) {
      if (rank >= 3 && rank <= 10) return String(rank);
      return ({ 11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王' })[rank] || '?';
    }
    function cardParts(card) { return { rank: card.Rank ?? card.rank, suit: card.Suit ?? card.suit }; }
    function landlordCardName(card) {
      const { rank, suit } = cardParts(card);
      const suits = ['♠','♥','♣','♦',''];
      return `${suits[suit] || ''}${landlordRank(rank)}`;
    }
    function renderLandlord() {
      const playerId = document.querySelector('#playerId').value;
      const ownSeat = roomView.players.findIndex(player => player.id === playerId);
      const isTurn = ownSeat >= 0 && gameView.turnPlayer === playerId;
      const auction = gameView.phase === 0;
      const playing = gameView.phase === 1;
      const cards = gameView.hand || [];
      const idFor = card => { const p = cardParts(card); return `${p.suit}:${p.rank}`; };
      const ids = new Set(cards.map(idFor));
      selectedCards = new Set([...selectedCards].filter(id => ids.has(id)));
      const landlord = gameView.landlord >= 0 ? roomView.players[gameView.landlord]?.name : '尚未确定';
      document.querySelector('#landlordInfo').textContent = `${auction ? '叫分阶段' : playing ? '出牌阶段' : gameView.phase === 3 ? '本局结束' : '重新发牌'} · 当前最高叫分 ${gameView.highestBid} · 地主 ${landlord}`;
      document.querySelector('#landlordTurn').textContent = gameView.phase === 3 ? `${roomView.players[gameView.winner]?.name || '玩家'} 获胜` : isTurn ? '轮到你了' : `${roomView.players[gameView.turnSeat]?.name || '玩家'}行动中`;
      const trick = gameView.trick;
      document.querySelector('#landlordTrick').textContent = trick ? `${roomView.players[trick.Seat]?.name || '玩家'}：${trick.Cards.map(landlordCardName).join(' ')}` : '当前没有待跟牌';
      document.querySelector('#landlordBottom').textContent = gameView.bottom?.length ? `底牌：${gameView.bottom.map(landlordCardName).join(' ')}` : '';
      const positions = ['bottom','left','right'];
      for (let seat = 0; seat < 3; seat++) {
        const relative = (seat - ownSeat + 3) % 3;
        const box = document.querySelector(`#landlordTable [data-seat="${positions[relative]}"]`);
        box.classList.toggle('active', gameView.turnSeat === seat && gameView.phase < 3);
        box.replaceChildren();
        const name = document.createElement('strong');
        name.textContent = `${roomView.players[seat].name}${seat === ownSeat ? '（你）' : ''}${roomView.players[seat].bot ? ' · AI' : ''}`;
        const meta = document.createElement('small');
        meta.textContent = `${gameView.cardsLeft[seat]} 张牌${gameView.landlord === seat ? ' · 地主' : ''}`;
        box.append(name, meta);
      }
      const handBox = document.querySelector('#landlordHand');
      handBox.replaceChildren();
      cards.forEach(card => {
        const key = idFor(card);
        const parts = cardParts(card);
        const button = document.createElement('button');
        button.className = `playingCard${[1,3].includes(parts.suit) ? ' red' : ''}${selectedCards.has(key) ? ' selected' : ''}`;
        button.textContent = landlordCardName(card);
        button.disabled = !isTurn || !playing;
        button.setAttribute('aria-pressed', selectedCards.has(key));
        button.addEventListener('click', () => {
          if (selectedCards.has(key)) selectedCards.delete(key); else selectedCards.add(key);
          renderLandlord();
        });
        handBox.append(button);
      });
      const bidActions = document.querySelector('#bidActions');
      bidActions.hidden = !auction;
      bidActions.querySelectorAll('[data-bid]').forEach(button => {
        const bid = Number(button.dataset.bid);
        button.disabled = !isTurn || !auction || (bid > 0 && bid <= gameView.highestBid);
        button.onclick = () => sendGameAction({ type: 'bid', bid });
      });
      document.querySelector('#playActions').hidden = !playing;
      const canFollow = trick && trick.Seat !== ownSeat;
      document.querySelector('#landlordPlay').disabled = !isTurn || !playing || selectedCards.size === 0;
      document.querySelector('#landlordPlay').onclick = () => sendGameAction({ type: 'play', cards: cards.filter(card => selectedCards.has(idFor(card))).map(card => { const p = cardParts(card); return { Suit: p.suit, Rank: p.rank }; }) });
      document.querySelector('#landlordPass').disabled = !isTurn || !playing || !canFollow;
      document.querySelector('#landlordPass').onclick = () => sendGameAction({ type: 'play', cards: [] });
    }
    function renderGomoku() {
      const playerId = document.querySelector('#playerId').value;
      const ownSeat = roomView.players.findIndex(player => player.id === playerId);
      const currentName = roomView.players.find(player => player.id === gameView.turnPlayer)?.name || '玩家';
      const ended = Boolean(gameView.winner || gameView.draw);
      const winnerName = roomView.players.find(player => player.id === gameView.winner)?.name;
      document.querySelector('#gomokuStatus').textContent = gameView.winner ? `${winnerName || '玩家'} 获胜` : gameView.draw ? '平局' : `${currentName}行动 · ${gameView.turn === 1 ? '黑棋' : '白棋'}${gameView.turnPlayer === playerId ? '（轮到你）' : ''}`;
      const grid = document.querySelector('#gomokuGrid');
      grid.replaceChildren();
      for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
          const cell = document.createElement('button');
          cell.className = 'gomokuCell';
          cell.setAttribute('aria-label', `${x + 1} 列 ${y + 1} 行`);
          cell.disabled = ended || ownSeat < 0 || gameView.turnPlayer !== playerId || gameView.board[y][x] !== 0;
          if (gameView.board[y][x] !== 0) {
            const stone = document.createElement('span');
            stone.className = `stone ${gameView.board[y][x] === 1 ? 'black' : 'white'}${gameView.lastMove?.x === x && gameView.lastMove?.y === y ? ' lastMove' : ''}`;
            cell.append(stone);
          } else if ([3,7,11].includes(x) && [3,7,11].includes(y)) {
            const dot = document.createElement('span');
            dot.className = 'hoshiDot';
            cell.append(dot);
          }
          cell.addEventListener('click', () => sendGameAction({ type: 'place', x, y }));
          grid.append(cell);
        }
      }
    }
    document.querySelector('#create').addEventListener('click', async () => {
      status.textContent = '正在创建房间…';
      const name = document.querySelector('#name').value.trim();
      const playerId = document.querySelector('#playerId').value.trim() || crypto.randomUUID();
      try {
        const response = await fetch('/api/rooms', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: modeSelect.value, seats: Number(seatsSelect.value), bots: document.querySelector('#trainingBots').checked ? 2 : 0, name, playerId })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '创建失败');
        document.querySelector('#playerId').value = playerId;
        document.querySelector('#roomCode').value = data.code;
        status.textContent = `房间 ${data.code} 已创建 · ${data.players.length}/${data.seats} 人 · ${data.mode}`;
        connectRoom(data.code, playerId);
      } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#join').addEventListener('click', async () => {
      try {
        const player = identity();
        const data = await roomAction('join', player);
        connectRoom(data.code, player.playerId);
      } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#ready').addEventListener('click', async () => {
      try { await roomAction('ready', { playerId: identity().playerId, ready: true }); } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#start').addEventListener('click', async () => {
      try { await roomAction('start'); } catch (error) { status.textContent = error.message; }
    });
    document.querySelector('#chatForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.querySelector('#chatText');
      const text = input.value.trim();
      if (!text || !roomSocket || roomSocket.readyState !== WebSocket.OPEN) return;
      roomSocket.send(JSON.stringify({ type: 'chat', text }));
      input.value = '';
    });
    loadModes().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
